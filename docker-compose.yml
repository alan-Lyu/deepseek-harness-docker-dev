services:
  deepseek-harness:
    hostname: dsh-dev
    build:
      context: ./build             # Build using the Dockerfile in this directory.
      dockerfile: Dockerfile       # Explicitly select the Dockerfile.
    container_name: deepseek-harness
    restart: unless-stopped
    pids_limit: 1024
    userns_mode: host
    security_opt:
      # Install build/deepseek-harness on the host before starting the service.
      - apparmor=deepseek-harness
      # bubblewrap workspace-write requires namespace syscalls blocked by Docker's default profile.
      # Replace only after a tested, narrowly scoped custom seccomp profile is available.
      - seccomp=unconfined
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # socat forwards port 3081 to DSH at 127.0.0.1:3080 inside the container.
    ports:
      - "127.0.0.1:3080:3081"
      - "127.0.0.1:2222:2222"
    volumes:
      # Persistent data such as sessions, settings, and tokens.
      - dsh-data:/data/dsh
      # Optional workspace mount for Agent read/write access; adjust as needed.
      - ./workspace:/home/developer/workspace
    environment:
      # The data directory must match DSH_HOME in the Dockerfile.
      - DSH_HOME=/data/dsh
      - DSH_PORT=3080
      # Required on first run; the validated public key is then persisted in dsh-data.
      - SSH_PUB_KEY=${SSH_PUB_KEY:-}

volumes:
  dsh-data:      # Named volume managed by Docker.

# Portable base configuration for Linux, Windows, and macOS (Docker Desktop).
# Linux hosts should merge the hardening overlay for the AppArmor profile and
# userns_mode: host:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml <command>

services:
  deepseek-harness:
    hostname: dsh-dev
    build:
      context: ./build             # Build using the Dockerfile in this directory.
      dockerfile: Dockerfile       # Explicitly select the Dockerfile.
    container_name: deepseek-harness
    restart: unless-stopped
    pids_limit: 1024
    security_opt:
      # bubblewrap workspace-write requires namespace syscalls blocked by the default
      # seccomp profile (applied on Linux and Docker Desktop >= 4.42); disable it on
      # every platform.
      - seccomp=unconfined
      # Linux-only hardening (apparmor=deepseek-harness + userns_mode: host) is added
      # by docker-compose.linux.yml; AppArmor is a host-kernel feature that does not
      # exist on Windows/macOS.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # socat forwards port 3081 to DSH at 127.0.0.1:3080 inside the container.
    ports:
      - "127.0.0.1:3080:3081"
      - "127.0.0.1:2222:2222"
    volumes:
      # Persistent data such as sessions, settings, and tokens.
      - dsh-data:/data/dsh
      # Optional workspace mount for Agent read/write access; adjust as needed.
      - ./workspace:/home/developer/workspace
    environment:
      # The data directory must match DSH_HOME in the Dockerfile.
      - DSH_HOME=/data/dsh
      - DSH_PORT=3080
      # Required on first run; the validated public key is then persisted in dsh-data.
      - SSH_PUB_KEY=${SSH_PUB_KEY:-}

volumes:
  dsh-data:      # Named volume managed by Docker.
